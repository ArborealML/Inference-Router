auto_switch = false
default_model = "swift"

[engine.hyperqwen]
kind = "openai-compatible"
endpoint = "http://127.0.0.1:28020/v1"
lifecycle_owner = "router"
lifecycle = "docker"

[engine.hyperqwen.docker]
image = "registry.invalid/selector-fixture/hyperqwen:offline"
image_id = "sha256:1111111111111111111111111111111111111111111111111111111111111111"
image_repo_digest = "registry.invalid/selector-fixture/hyperqwen@sha256:2222222222222222222222222222222222222222222222222222222222222222"
image_platform = "linux/amd64"
router_id = "selector-fixture"
command = ["single"]
host_ip = "127.0.0.1"
host_port = 28020
container_port = 8000
stop_timeout_ms = 60000
init = true
restart = "unless-stopped"
log_rotation = { max_size = "20m", max_files = 3 }
env = ["HOME=/cache", "MODEL=/app/models", "PREPARE=0", "VERIFY=0", "HOST=0.0.0.0", "PORT=8000"]

[engine.hyperqwen.docker.resources]
gpu = { device_ids = ["0", "1"] }
