env = [
  "CTX=long",
  "SPEC=mtp",
  "DRAFT_TOKENS=3",
  "MAX_LEN=262144",
  "MAX_SEQS=1",
  "GPU_UTIL=0.90",
  "TOOLS=1",
  "PREFIX_CACHE=1",
  "VISION=1",
  "API_SERVERS=1",
  "HF_HUB_OFFLINE=1",
  "TRANSFORMERS_OFFLINE=1",
  "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False",
