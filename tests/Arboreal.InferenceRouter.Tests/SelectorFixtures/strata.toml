listen = "http://127.0.0.1:28321"
default_model = "qwen3.8-flash-next-iq3_s"
auto_switch = false

[scheduler]
max_inflight_per_engine = 4

[engine.strata]
kind = "openai-compatible"
endpoint = "http://127.0.0.1:28021/v1"
lifecycle_owner = "router"
lifecycle = "docker"
models_endpoint = "/v1/models"
loaded_requires_status_loaded = true
models_context_window_path = "meta.n_ctx"

[engine.strata.health_probe]
path = "/props"
expect = "total_slots>0"
context_path = "default_generation_settings.n_ctx"
slots_path = "total_slots"
interval_ms = 5000
timeout_ms = 10000

[engine.strata.docker]
image = "registry.invalid/selector-fixture/strata:offline"
image_id = "sha256:3333333333333333333333333333333333333333333333333333333333333333"
image_repo_digest = "registry.invalid/selector-fixture/strata@sha256:4444444444444444444444444444444444444444444444444444444444444444"
image_platform = "linux/amd64"
router_id = "selector-fixture"
socket = "unix:///fixture/no-daemon.sock"
api_version = "v1.44"
host_ip = "127.0.0.1"
host_port = 28021
container_port = 8080
stop_timeout_ms = 120000
wait_health = true
wait_timeout_ms = 7200000
remove_stopped = true
env = ["MODEL_PATH=/models", "GPUS=0,1", "VISION=cpu", "KV=int8", "TUNE=skip", "STRATA_ROUTE_TAIL_SKIP=0", "API_KEY_FILE=/opt/strata/fixture-token"]

[engine.strata.docker.resources]
gpu = { all = true }
shm_size_bytes = 2147483648
ulimits = [{ name = "memlock", soft = -1, hard = -1 }]
bind_mounts = [
  { source = "/fixture/install/run-fixture/strata-token", target = "/opt/strata/fixture-token", read_only = true },
  { source = "/fixture/install/strata_profiles.py", target = "/profile-check.py", read_only = true },
