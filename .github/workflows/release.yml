# Tagged releases: build a stripped Native-AOT `air` binary per platform, smoke-test each one
# on its own operating system, and only then create the GitHub Release.
#
# Tag pattern: v<major>.<minor>.<patch> (optionally with a -prerelease suffix), e.g. v0.1.0.
# Pushing such a tag runs this workflow. A tag that already has a release — published or draft —
# is rejected in `preflight`, before any checkout, build or runner time is spent.
#
# Debugging without publishing: Actions → Release → Run workflow, with `dry_run` checked.
# Every declared platform leg builds and smoke-tests; no release is created.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
      dry_run:
        description: "Build and smoke-test without creating a release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # ── preflight: refuse to do any real work for a tag we cannot release ─────────────
  preflight:
    name: preflight (tag exists, is well formed, has no release)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Draft releases are only visible to a token with write access, and a leftover draft from an
    # interrupted run must block a new build exactly like a published release does. This job reads
    # only; the write permission is what makes the draft visible to it.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Resolve the tag and its commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # lets `gh api repos/{owner}/{repo}/…` resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            dry="true"
          else
            tag="${GITHUB_REF_NAME}"
            dry="false"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a release tag (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          # Resolves annotated and lightweight tags alike; also proves the tag is on this repo.
          commit="$(gh api "repos/{owner}/{repo}/commits/$tag" --jq .sha 2>/dev/null || true)"
          if [ -z "$commit" ]; then
            echo "::error::tag $tag does not exist in this repository (or does not resolve to a commit)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "will build $tag at $commit (dry_run=$dry)"

      - name: Refuse if a release already exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Note: the "release by tag name" endpoint hides drafts, so list and filter instead —
          # a half-finished draft from an earlier run must block a new build just as a published
          # release does. --paginate means a second page of releases cannot hide an existing one,
          # and more than one match is reported as a conflict rather than releasing the first hit.
          flags="$(gh api --paginate "repos/{owner}/{repo}/releases?per_page=100" --jq ".[] | select(.tag_name==\"$TAG\") | .draft" 2>/dev/null | tr '\n' ' ' || true)"
          set -- ${flags}   # unquoted on purpose: $# is then the number of releases on this tag
          case "$#" in
            0) kind=absent ;;
            1) if [ "$1" = "true" ]; then kind=draft; else kind=published; fi ;;
            *) kind="conflicting ($#)" ;;
          esac
          if [ "$kind" != "absent" ]; then
            echo "::error::refusing to build: a $kind release for $TAG already exists (delete it first if a re-release is intended)"
            exit 1
          fi
          echo "no existing release for $TAG"

  # ── one native build + smoke test per platform ────────────────────────────────────
  build:
    name: build + smoke (${{ matrix.rid }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            exe: air
          - rid: win-x64
            os: windows-2022
            exe: air.exe
          # Two legs, deliberately. The account has no macOS runner minutes, so a macos-* job queues
          # forever rather than failing, and the asset gate below would then wait on an archive no
          # runner ever produces. macOS stays a local build (`dotnet publish -r osx-arm64`); nothing
          # is published, claimed or gated on it. Add a leg back only with minutes and a leg that runs.
    steps:
      - uses: actions/checkout@v4
        with:
          # Always build the exact commit the tag points at, so a dispatch run cannot drift
          # onto the default branch.
          ref: ${{ needs.preflight.outputs.commit }}
      - name: Install the .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-quality: preview

      - name: Publish stripped Native AOT (${{ matrix.rid }})
        run: |
          set -euo pipefail
          dotnet publish src/Arboreal.InferenceRouter.Cli -c Release -r ${{ matrix.rid }} \
            -p:PublishAot=true -p:StripSymbols=true -p:DebugSymbols=false -p:DebugType=None \
            -p:InvariantGlobalization=true -v minimal 2>&1 | tee aot-${{ matrix.rid }}.log
          if grep -E "warning (IL|TRIM)" "aot-${{ matrix.rid }}.log"; then
            echo "::error::AOT publish produced trim/AOT warnings for ${{ matrix.rid }}"
            exit 1
          fi
        shell: bash

      - name: Stage the binary
        run: |
          set -euo pipefail
          src="src/Arboreal.InferenceRouter.Cli/bin/Release/net11.0/${{ matrix.rid }}/publish/${{ matrix.exe }}"
          test -f "$src" || { echo "::error::$src missing"; exit 1; }
          mkdir -p dist
          cp "$src" "dist/${{ matrix.exe }}"
          ls -l dist
        shell: bash

      # The same script runs on every platform, on the machine that will run the binary.
      # It proves the binary starts, validates config without touching sockets, serves the
      # OpenAI-compatible surface against a fake engine, relays every streamed frame, and maps
      # an engine failure to 502/engine_error.
      - name: Smoke-test the binary on ${{ matrix.os }}
        run: bash tools/ci/smoke.sh "dist/${{ matrix.exe }}"
        shell: bash

      - name: Package
        run: |
          set -euo pipefail
          tar -czf "air-${{ matrix.rid }}.tar.gz" -C dist "${{ matrix.exe }}"
          sha256sum "air-${{ matrix.rid }}.tar.gz" > "air-${{ matrix.rid }}.tar.gz.sha256"
          ls -l "air-${{ matrix.rid }}.tar.gz"
        shell: bash

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.rid }}
          path: |
            air-${{ matrix.rid }}.tar.gz
            air-${{ matrix.rid }}.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.rid }}
          path: |
            aot-*.log
            /tmp/air-router.log
            /tmp/air-fixture.log
          retention-days: 5
          if-no-files-found: ignore

  # ── create the release only after every platform binary passed its smoke test ─────
  release:
    name: publish release
    needs: [preflight, build]
    if: needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.preflight.outputs.tag }}
      # The commit preflight resolved from the tag and every build leg checked out. Re-checking it
      # against the tag before publish is what makes "the tag exists" mean "the tag still means this".
      COMMIT: ${{ needs.preflight.outputs.commit }}
      # One manifest, two consumers: this list drives both the gate below and the upload list,
      # so a leg cannot be verified by one set of names and published by another.
      EXPECTED_RIDS: "linux-x64 win-x64"
    steps:
      - name: Collect assets
        uses: actions/download-artifact@v4
        with:
          pattern: "asset-*"
          path: out
          # Deliberately not merge-multiple: each leg artifact keeps its own directory, so two
          # artifacts carrying the same basename collide at staging instead of silently
          # overwriting each other in one flattened folder.
      - name: Stage, verify and bind every declared asset
        run: |
          set -euo pipefail
          stage=stage
          rm -rf "$stage"; mkdir -p "$stage"
          # Every declared leg must arrive, and nothing that is not a declared leg may arrive.
          # Word equality, not a substring test: `case " $EXPECTED_RIDS " in *" $rid "*)` accepts one
          # artifact named for two legs at once (`asset-linux-x64 win-x64`), which is not a leg.
          for want in $EXPECTED_RIDS; do
            test -d "out/asset-$want" || { echo "::error::no artifact arrived for declared leg $want"; exit 1; }
          done
          for d in out/asset-*; do
            [ -d "$d" ] || { echo "::error::$d is not a leg artifact directory"; exit 1; }
            rid="${d##*/}"; rid="${rid#asset-}"
            known=false
            for want in $EXPECTED_RIDS; do
              if [ "$rid" = "$want" ]; then known=true; fi
            done
            if [ "$known" != true ]; then
              echo "::error::artifact $d names no declared leg ($EXPECTED_RIDS) — refusing to publish"; exit 1
            fi
            # The inventory walks every entry, not only regular files: a directory or a symlink
            # wearing an expected name has to be refused by name, and the leg produces exactly two.
            count=0
            while IFS= read -r f; do
              base="${f##*/}"
              case "$base" in
                "air-${rid}.tar.gz"|"air-${rid}.tar.gz.sha256") ;;
                *) echo "::error::$d carries $base, which the $rid leg does not produce"; exit 1 ;;
              esac
              count=$((count+1))
            done < <(find "$d" -mindepth 1 -maxdepth 1)
            if [ "$count" -ne 2 ]; then
              echo "::error::$d holds $count entries; the $rid leg produces exactly 2"; exit 1
            fi
            for n in "air-${rid}.tar.gz" "air-${rid}.tar.gz.sha256"; do
              if [ -L "$d/$n" ] || [ ! -f "$d/$n" ]; then
                echo "::error::$d/$n is not a regular file"; exit 1
              fi
              test -s "$d/$n" || { echo "::error::missing or empty $d/$n — the $rid leg did not produce an asset"; exit 1; }
            done
          done
          for rid in $EXPECTED_RIDS; do
            d="out/asset-${rid}"
            for n in "air-${rid}.tar.gz" "air-${rid}.tar.gz.sha256"; do
              if [ -e "$stage/$n" ]; then
                echo "::error::$n arrived from more than one artifact — refusing to publish an overwritten asset"
                exit 1
              fi
              cp "$d/$n" "$stage/$n"
            done
          done
          # Present and non-empty is not a package. The packaging step above writes exactly one
          # member per archive, so the gate asks for exactly one, matched as a literal string:
          # `grep -qx "$exe"` is a regex, so `airXexe` satisfies it in place of `air.exe`; `-F` matches
          # it as a name. A member named `./air` or `sub/air` fails the literal test, so nothing nested
          # or extra can ride along inside a published archive. A name is not a member *type* either:
          # `tar -tzf` lists names only, so a symlink or hardlink member called air.exe passes a name
          # test while unpacking into nothing runnable — the verbose listing puts the type character
          # first, and only a regular file (`-`) is accepted.
          for rid in $EXPECTED_RIDS; do
            case "$rid" in
              linux-x64) exe="air" ;;
              win-x64) exe="air.exe" ;;
              *) echo "::error::no archive member rule is defined for leg $rid — add it here and to the matrix"; exit 1 ;;
            esac
            if ! members="$(tar -tzf "$stage/air-${rid}.tar.gz" 2>/dev/null)"; then
              echo "::error::air-${rid}.tar.gz is not a readable tar.gz"; exit 1
            fi
            if ! listing="$(tar -tzvf "$stage/air-${rid}.tar.gz" 2>/dev/null)"; then
              echo "::error::air-${rid}.tar.gz does not list verbosely"; exit 1
            fi
            if [ "$(printf '%s\n' "$members" | wc -l)" -ne 1 ] || [ "$(printf '%s\n' "$listing" | wc -l)" -ne 1 ] \
               || [ "${listing:0:1}" != "-" ] || ! grep -Fqx -- "$exe" <<< "$members"; then
              echo "::error::air-${rid}.tar.gz must hold exactly one regular member named $exe; it holds: $(printf '%s' "$listing" | tr '\n' ' ')"
              exit 1
            fi
          done
          # Bind each archive to the record its own leg wrote, by comparing the whole producer
          # line — digest and filename together — against what sha256sum computes for that RID's
          # archive. `sha256sum --check sidecar` follows the names *inside* the sidecar instead,
          # so a sidecar naming a different archive would pass while that archive shipped blind.
          for rid in $EXPECTED_RIDS; do
            if ! (cd "$stage" && sha256sum "air-${rid}.tar.gz" | cmp -s - "air-${rid}.tar.gz.sha256"); then
              echo "::error::air-${rid}.tar.gz does not match the checksum record its own leg wrote — refusing to publish"
              exit 1
            fi
          done
          # A computed manifest, not a signature: it detects transfer and collection damage,
          # and proves nothing about who produced the bytes.
          (cd "$stage" && sha256sum air-*.tar.gz > SHA256SUMS && cat SHA256SUMS)
        shell: bash
      - name: Create the draft, inspect the remote, then publish
        id: publish
        run: |
          set -euo pipefail
          assets=()
          for rid in $EXPECTED_RIDS; do
            assets+=("air-${rid}.tar.gz" "air-${rid}.tar.gz.sha256")
          done
          assets+=("SHA256SUMS")
          prerelease=false
          # preflight admits a tag with a -suffix; without prerelease=true GitHub would list such a
          # release as a final one.
          case "$TAG" in *-*) prerelease=true ;; esac
          # Preflight proved the tag exists, and the tag was never the thing at issue: a tag can move
          # after preflight. Re-resolve it and compare against what the legs
          # actually built, or a tag moved after preflight would publish somebody else's commit.
          tag_sha="$(gh api "repos/{owner}/{repo}/commits/$TAG" --jq .sha 2>/dev/null || true)"
          if [ -z "$tag_sha" ] || [ "$tag_sha" != "$COMMIT" ]; then
            echo "::error::tag $TAG resolves to ${tag_sha:-nothing}, but the legs built $COMMIT — not publishing"
            exit 1
          fi
          # Two gh contracts, both checked against the tool and the API description rather than
          # assumed (gh 2.46.0 on this box, plus github/rest-api-description, fetched 2026-11-17):
          #   1. `gh release create … --json id --jq .id` fails argument parsing ("unknown flag:
          #      --json", exit 1) before it reaches the API, and `gh release view|edit` read their
          #      operand as a tag, not a release id (`gh release view 443387629 -R cli/cli` answers
          #      "release not found").
          #   2. `GET /repos/{owner}/{repo}/releases/tags/{tag}` is described as "Get a published
          #      release with the specified tag", and a draft release is listed only for a token with
          #      push access. So a release created as a draft cannot be found by tag: the tag lookup
          #      this step used is not a way to find this run's draft, and `gh release upload <tag>`
          #      and `gh release create --draft` are tag-addressed all the way down.
          # So the create is REST: POST /releases, which answers with the id and upload_url of the
          # release it just made. The id is not looked up afterwards, so it is not a claim about who
          # owns the tag — it is the thing this run was handed. Draft and prerelease are typed with
          # -F, because -f sends strings.
          # Say so before the call: if create dies partway there is no id to hand cleanup, and the
          # cleanup step can still tell "attempted, no id" (possible orphan) from "never got here".
          echo "create_attempted=1" >> "$GITHUB_OUTPUT"
          created="$(gh api -X POST repos/{owner}/{repo}/releases \
            -f tag_name="$TAG" -F draft=true -F prerelease="$prerelease" \
            -F generate_release_notes=true --jq '[.id,(.upload_url // "")] | join(" ")')"
          read -r rel_id upload_url <<<"$created"
          case "${rel_id:-}" in
            ''|*[!0-9]*)
              echo "::error::create returned no numeric release id (got ${rel_id:-nothing}) — not publishing, and leaving whatever exists for a human"
              exit 1
              ;;
          esac
          if [ -z "${upload_url:-}" ]; then
            echo "::error::release $rel_id came back with no upload_url — not publishing, and leaving draft $rel_id for a human"
            exit 1
          fi
          echo "release_id=$rel_id" >> "$GITHUB_OUTPUT"
          echo "created draft $rel_id for $TAG at $tag_sha"
          # Upload by that id, through the upload_url the create returned with its own URI template.
          # gh does not expand templates — `…latest{?per_page}` is sent literally and 404s — so the
          # template part is cut off here and the name is put in the query by hand. Asset names are
          # this gate's own (air-<rid>.tar.gz, its .sha256, SHA256SUMS): ASCII with no characters
          # that need percent-encoding. The body is the file itself over an octet-stream header; if
          # anything mangled it on the way, the stored-digest check below stops the publication.
          upload_base="${upload_url%%\{*}"
          for n in "${assets[@]}"; do
            asset_id="$(gh api -X POST "${upload_base}?name=$n" -H 'Content-Type: application/octet-stream' --input "stage/$n" --jq '.id')"
            case "${asset_id:-}" in
              ''|*[!0-9]*)
                echo "::error::upload of $n to release $rel_id returned no asset id (got ${asset_id:-nothing}) — not publishing, and leaving draft $rel_id for a human"
                exit 1
                ;;
            esac
            echo "uploaded $n as asset $asset_id"
          done
          # Upload and publish are separate API calls, so read the draft back from GitHub before
          # it goes public: the asset set and the flags have to be right while they are still
          # fixable. Every lookup below addresses the id this run created, so a page of a hundred
          # other releases cannot hide it.
          got_tag="$(gh api "repos/{owner}/{repo}/releases/$rel_id" --jq .tag_name)"
          if [ "$got_tag" != "$TAG" ]; then
            echo "::error::release $rel_id carries tag $got_tag, expected $TAG — not publishing"
            exit 1
          fi
          want_assets="$( { for rid in $EXPECTED_RIDS; do printf '%s\n' "air-$rid.tar.gz" "air-$rid.tar.gz.sha256"; done; printf 'SHA256SUMS\n'; } | sort | paste -sd' ' )"
          # One call, one snapshot. Five separate per-name lookups would each be true of some moment
          # on the server and none of them the same moment; here the inventory and every field read
          # from it come from a single list of this release's own assets, addressed by id.
          inspect_draft() {
            snap="$(gh api "repos/{owner}/{repo}/releases/$rel_id/assets?per_page=100" --jq '.[] | [.name,.state,(.size|tostring),(.digest // "none"),("(\(.id))")] | join(" ")')"
            got_assets="$(printf '%s\n' "$snap" | awk '{print $1}' | sort | paste -sd' ' -)"
            if [ "$got_assets" != "$want_assets" ]; then
              echo "::error::remote draft carries [$got_assets], expected [$want_assets] — not publishing"
              exit 1
            fi
            # A name on the inventory is not a byte. Each asset has to appear exactly once, have
            # finished uploading, match the staged file's size, and carry the digest GitHub reports
            # for the bytes it stored — so a truncated, replaced or still-uploading asset stops the
            # publication instead of becoming the download link, and an equal-size substitution stops
            # too. A digest the remote does not report fails the gate: an unverifiable field is not a
            # passing one.
            for n in $want_assets; do
              rows="$(printf '%s\n' "$snap" | awk -v want="$n" '$1 == want')"
              read -r _ state size digest _ <<<"$rows"
              want_size="$(stat -c %s "stage/$n")"
              want_digest="sha256:$(sha256sum "stage/$n" | cut -d' ' -f1)"
              if [ "$(printf '%s\n' "$rows" | grep -c .)" != "1" ] || [ "${state:-absent}" != "uploaded" ] || [ "${size:-0}" != "$want_size" ] || [ "${digest:-none}" != "$want_digest" ]; then
                echo "::error::asset $n is [${state:-absent} ${size:-0} ${digest:-none}] ($(printf '%s\n' "$rows" | grep -c .) row(s)), expected [uploaded $want_size $want_digest] in exactly one row — not publishing"
                exit 1
              fi
            done
            got_flags="$(gh api "repos/{owner}/{repo}/releases/$rel_id" --jq '[.draft,.prerelease] | join(" ")')"
            if [ "$got_flags" != "true $prerelease" ]; then
              echo "::error::remote draft state is [$got_flags], expected [true $prerelease] — not publishing"
              exit 1
            fi
          }
          inspect_draft
          echo "draft $rel_id for $TAG verified: $got_assets"
          # Last look before it goes public. Everything above is a few API calls old, and this run
          # only serializes against other runs on the same ref, so the tag could have moved and the
          # draft could have been touched while we were reading it. This narrows the window; it does
          # not close it, and tag protection plus a restricted set of release writers is what closes
          # it (a repository setting, not something YAML can enforce).
          tag_now="$(gh api "repos/{owner}/{repo}/commits/$TAG" --jq .sha 2>/dev/null || true)"
          if [ -z "$tag_now" ] || [ "$tag_now" != "$COMMIT" ]; then
            echo "::error::tag $TAG now resolves ${tag_now:-nothing}, but the legs built $COMMIT — leaving draft $rel_id unpublished for a human"
            exit 1
          fi
          inspect_draft
          # By id, not by tag: the tag is not the thing this run made, and `gh release edit` would
          # resolve the operand as a tag name anyway.
          gh api -X PATCH "repos/{owner}/{repo}/releases/$rel_id" -F draft=false >/dev/null
          after="$(gh api "repos/{owner}/{repo}/releases/$rel_id" --jq '[.draft,.prerelease] | join(" ")')"
          if [ "$after" != "false $prerelease" ]; then
            echo "::error::published release state is [$after], expected [false $prerelease] — check the releases page before trusting it"
            exit 1
          fi
          # The record of what went public, read back by id.
          gh api "repos/{owner}/{repo}/releases/$rel_id" \
            --jq "{id:.id,tag_name:.tag_name,draft:.draft,prerelease:.prerelease,assets:[.assets[]|{name:.name,size:.size}]}"
        shell: bash
      # Delete only the release this run can prove it made: the id its own create call answered with.
      # The old guard compared the draft's created_at against
      # `github.run_started_at`, which is not a documented Actions context property — empty, it turns
      # the comparison into a no-op and the step deletes whoever else's draft happens to carry this
      # tag. If no id was captured, nothing here is safe to remove: say so loudly and leave a human
      # the preflight refusal to work with.
      - name: Remove a half-finished draft
        if: failure()
        env:
          CREATED_ID: ${{ steps.publish.outputs.release_id }}
          CREATE_ATTEMPTED: ${{ steps.publish.outputs.create_attempted }}
        run: |
          set -euo pipefail
          if [ -z "${CREATED_ID:-}" ]; then
            # Ambiguous: the run may have created a draft and died before capturing its id. Nothing
            # here may delete by tag or by age, so the outcome is a loud manual-intervention note,
            # not a silent success.
            if [ "${CREATE_ATTEMPTED:-}" = "1" ]; then
              echo "::warning::this run asked GitHub for a release for $TAG but captured no id: a draft may exist for $TAG and this run cannot prove which one. Manual review required — this step deletes nothing it cannot address by id."
            else
              echo "this run created no release id; leaving any release for $TAG for a human"
            fi
            exit 0
          fi
          row="$(gh api "repos/{owner}/{repo}/releases/$CREATED_ID" --jq "[.id,.tag_name,.draft]|join(\" \")" 2>/dev/null || true)"
          read -r id tag draft <<<"$row"
          if [ "${id:-}" != "$CREATED_ID" ] || [ "${tag:-}" != "$TAG" ] || [ "${draft:-}" != "true" ]; then
            echo "release $CREATED_ID is not an unpublished draft of $TAG (${row:-gone}); leaving it"
            exit 0
          fi
          gh api -X DELETE "repos/{owner}/{repo}/releases/$CREATED_ID"
          echo "deleted draft release $CREATED_ID for $TAG (this run created it)"
        shell: bash
