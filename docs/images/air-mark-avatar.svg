<!-- AIR identity, mark — avatar variant. Derived from air-mark.svg at the repository owner's request, same original paths, no third-party assets, no stock art. MIT (see LICENSE).
     Why this variant exists: air-mark.svg strokes in currentColor and declares no field, so rendered on its own it is black on transparent and invisible on a dark avatar frame. This file fixes the field and stroke colours explicitly and adds padding so a circular crop loses nothing.
     Palette is the repository identity palette: #10241F field, #F3F7F2 mark (see docs/images/README.md). Artwork is original vector markup, generated for this project by an external model service at the owner's request; this variant is a recolour and reframe of that same artwork. -->
